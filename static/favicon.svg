<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Gradiente para a cobra superior (Verde Neon com contraste) -->
        <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bbf000" />
            <stop offset="100%" stop-color="#80b800" />
        </linearGradient>

        <!-- Gradiente para a cobra inferior (Roxo vibrante) -->
        <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#7e22ce" />
        </linearGradient>

        <!-- Sombra suave para destacar sobre fundos transparentes, brancos ou claros -->
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.18" />
        </filter>
    </defs>

    <!-- Fundo transparente -->
    <g filter="url(#soft-shadow)">
        <!-- Cobra Superior (Verde Neon / Lima) -->
        <path d="M 252 82 C 160 82 166 122 166 122 L 166 164 L 256 164 L 256 194 L 130 194 C 130 194 74 188 74 278 C 74 368 126 362 126 362 L 166 362 L 166 306 C 166 306 162 254 218 254 L 308 254 C 308 254 354 256 354 210 L 354 138 C 354 138 360 82 252 82 Z"
              fill="url(#lime-grad)"
              stroke="#5c8a00"
              stroke-width="3"
              stroke-linejoin="round" />

        <!-- Olho da cobra verde: círculo preto sólido com bolinha branca de brilho -->
        <circle cx="206" cy="124" r="14" fill="#111827" />
        <circle cx="209" cy="121" r="4.5" fill="#ffffff" />

        <!-- Cobra Inferior (Roxo vibrante) -->
        <path d="M 260 430 C 352 430 346 390 346 390 L 346 348 L 256 348 L 256 318 L 382 318 C 382 318 438 324 438 234 C 438 144 386 150 386 150 L 346 150 L 346 206 C 346 206 350 258 294 258 L 204 258 C 204 258 158 256 158 302 L 158 374 C 158 374 152 430 260 430 Z"
              fill="url(#purple-grad)"
              stroke="#581c87"
              stroke-width="3"
              stroke-linejoin="round" />

        <!-- Olho da cobra roxa: agora idêntico ao da verde, círculo preto sólido com a bolinha branca de reflexo -->
        <circle cx="306" cy="388" r="14" fill="#111827" />
        <circle cx="303" cy="385" r="4.5" fill="#ffffff" />

        <!-- Pequeno detalhe festivo de brilho estrelar -->
        <path d="M 408 92 Q 408 110 426 110 Q 408 110 408 128 Q 408 110 390 110 Q 408 110 408 92 Z" fill="#9333ea" />
    </g>
</svg>
